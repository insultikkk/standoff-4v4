<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Standoff 4v4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#07070a;--card:rgba(255,255,255,.035);--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);--txt:#f4f4f5;--mute:#a1a1aa;--dim:#71717a;--ct:#4ea3ff;--t:#ffa940;--ok:#22c55e}
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--txt);display:flex;flex-direction:column;align-items:center;padding:16px;min-height:100vh;overflow-x:hidden}
  /* аврора: два размытых пятна цветов команд */
  body::before,body::after{content:"";position:fixed;z-index:-1;width:70vmax;height:70vmax;border-radius:50%;filter:blur(110px);opacity:.28;animation:drift 18s ease-in-out infinite alternate;pointer-events:none}
  body::before{background:var(--ct);top:-35vmax;left:-25vmax}
  body::after{background:var(--t);bottom:-40vmax;right:-25vmax;animation-delay:-9s}
  @keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
  @media (prefers-reduced-motion:reduce){body::before,body::after,#status.go{animation:none}}
  .wrap{width:min(680px,100%);display:flex;flex-direction:column;align-items:center}
  .banner{width:100%;border-radius:20px;border:1px solid var(--line);box-shadow:0 20px 60px -20px rgba(0,0,0,.8)}
  .card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);overflow:hidden}
  /* spotlight под курсором */
  .card::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(400px circle at var(--x,50%) var(--y,-200%),rgba(255,255,255,.07),transparent 60%)}
  .label{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:28px 0 10px;align-self:flex-start}
  #name,#msg{font:inherit;padding:12px 14px;font-size:16px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.35);color:var(--txt);outline:none;transition:border-color .2s,box-shadow .2s}
  #name{width:min(340px,100%);margin-top:18px;text-align:center}
  #name:focus,#msg:focus{border-color:var(--line2);box-shadow:0 0 0 4px rgba(255,255,255,.05)}
  #status{margin-top:10px;color:var(--mute);font-size:14px;font-variant-numeric:tabular-nums;text-align:center}
  #status.go{font-weight:800;font-size:16px;background:linear-gradient(110deg,var(--ok) 35%,#d9ffe6 50%,var(--ok) 65%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 2.2s linear infinite}
  @keyframes shine{from{background-position:100% 0}to{background-position:-150% 0}}
  .teams{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;margin-top:18px}
  @media (max-width:560px){.teams{grid-template-columns:1fr}}
  .team h2{margin:0 0 4px;font-size:14px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
  .team h2::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 12px currentColor}
  .ct h2{color:var(--ct)}.t h2{color:var(--t)}
  .team.ct{box-shadow:inset 0 1px 0 rgba(78,163,255,.3)}.team.t{box-shadow:inset 0 1px 0 rgba(255,169,64,.3)}
  .slot{display:flex;align-items:center;gap:10px;width:100%;margin:8px 0 0;padding:10px 12px;min-height:50px;font:inherit;font-size:15px;border-radius:12px;border:1px dashed var(--line2);background:transparent;color:var(--dim);cursor:pointer;text-align:left;transition:background .2s,border-color .2s,transform .1s}
  .slot:hover{background:rgba(255,255,255,.04);color:var(--mute)}
  .slot:active{transform:scale(.98)}
  .slot.taken{border-style:solid;border-color:var(--line);background:rgba(255,255,255,.04);color:var(--txt);cursor:default}
  .slot.mine{border-color:rgba(34,197,94,.55);background:rgba(34,197,94,.07);cursor:pointer}
  .ava{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:#000}
  .ct .ava{background:var(--ct)}.t .ava{background:var(--t)}
  .slot .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .slot .st{font-size:12px;color:var(--dim);white-space:nowrap}
  .slot .st.ok{color:var(--ok);font-weight:600}
  #ready{margin-top:18px;padding:14px 34px;font:inherit;font-size:16px;font-weight:700;border-radius:14px;border:1px solid transparent;background:var(--ok);color:#03130a;cursor:pointer;box-shadow:0 10px 30px -8px rgba(34,197,94,.6);transition:transform .1s}
  #ready:active{transform:scale(.97)}
  #ready.on{background:rgba(9,20,13,.85);border-color:rgba(34,197,94,.6);color:#86efac;box-shadow:none}
  /* на телефоне кнопка «Готов» всегда внизу экрана */
  @media (max-width:767px){
    #ready{position:fixed;left:16px;right:16px;bottom:calc(12px + env(safe-area-inset-bottom));margin:0;z-index:20;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
    body.has-ready{padding-bottom:96px}
  }
  #chat{width:100%;padding:12px}
  #tabs{display:inline-flex;gap:4px;padding:4px;border-radius:12px;background:rgba(0,0,0,.35);border:1px solid var(--line)}
  #tabs button{font:inherit;font-size:14px;font-weight:500;background:none;border:none;color:var(--mute);padding:6px 14px;border-radius:9px;cursor:pointer}
  #tabs button.on{background:rgba(255,255,255,.1);color:var(--txt)}
  #msgs{height:240px;overflow-y:auto;padding:10px 4px;font-size:14px;line-height:1.55;overflow-wrap:anywhere}
  #msgs i{color:var(--dim)}
  #msgs b{color:var(--mute);font-weight:600} #msgs b.ct{color:var(--ct)} #msgs b.t{color:var(--t)}
  #send{display:flex;gap:8px}
  #msg{flex:1;min-width:0;font-size:15px}
  #send button{width:48px;border:none;border-radius:12px;background:var(--txt);color:#000;font-size:16px;cursor:pointer}
  #maps{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;width:100%}
  .map img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;opacity:.8;transition:opacity .2s,transform .4s;background:rgba(255,255,255,.04)}
  .map:hover img,.map.voted img{opacity:1}
  .map:hover img{transform:scale(1.04)}
  .map .info{position:relative;padding:10px 12px 12px;background:linear-gradient(to bottom,transparent,rgba(0,0,0,.25))}
  .map{padding:0;border-radius:16px;font:inherit;color:var(--txt);cursor:pointer;text-align:left;font-size:15px;transition:border-color .2s,transform .1s}
  .map:active{transform:scale(.98)}
  .map b{font-weight:600}
  .map span{float:right;color:var(--dim);font-variant-numeric:tabular-nums}
  .map small{display:block;color:var(--dim);font-size:12px;margin-top:4px;min-height:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .map.voted{border-color:rgba(34,197,94,.55);background:rgba(34,197,94,.07)}
  .map.top{border-color:rgba(255,204,102,.5)}
  .map.top span{color:#ffcc66;font-weight:800}
  #reset{margin:32px 0 8px;font:inherit;font-size:13px;background:none;border:1px solid rgba(239,68,68,.35);color:#f87171;padding:8px 16px;border-radius:10px;cursor:pointer}
  #reset:hover{background:rgba(239,68,68,.08)}
  button:focus-visible{outline:2px solid var(--line2);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
<img class="banner" src="banner.svg" alt="Standoff 2 — 4 на 4">
<input id="name" placeholder="Твой ник" maxlength="20">
<div id="status">Подключение…</div>
<div class="teams" id="teams"></div>
<button id="ready" hidden>Я готов</button>
<div class="label">Чат</div>
<div id="chat" class="card">
  <div id="tabs"><button data-ch="all">Все</button><button data-ch="team">Команда</button></div>
  <div id="msgs"></div>
  <form id="send"><input id="msg" maxlength="200" placeholder="Сообщение…" autocomplete="off"><button aria-label="Отправить">➤</button></form>
</div>
<div class="label">Какие карты хотите? · жми — голос, ещё раз — убрать</div>
<div id="maps"></div>
<button id="reset">Очистить всё</button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
// Realtime Database нужен только databaseURL; правила открывают только /lobby
firebase.initializeApp({ databaseURL: "https://standoff-4v4-default-rtdb.europe-west1.firebasedatabase.app" });
const ref = firebase.database().ref('lobby');

const me = localStorage.getItem('uid') || Math.random().toString(36).slice(2);
localStorage.setItem('uid', me);
const nameEl = document.getElementById('name');
nameEl.value = localStorage.getItem('name') || '';
nameEl.oninput = () => localStorage.setItem('name', nameEl.value.trim());

const TEAMS = [['ct','Спецназ'],['t','Террористы']];
// маппул соревновательного режима (по турнирным правилам 2026)
const MAPS = ['Sandstone','Province','Rust','Breeze','Dune','Hanami','Prison'];
const SLOTS = TEAMS.flatMap(([t]) => [0,1,2,3].map(i => t + i));
let state = {};

function render(){
  document.getElementById('teams').innerHTML = TEAMS.map(([t,label]) =>
    `<div class="card team ${t}"><h2>${label}</h2>` +
    [0,1,2,3].map(i => {
      const s = state[t+i];
      const cls = s ? 'slot taken' + (s.uid === me ? ' mine' : '') : 'slot';
      const txt = s
        ? `<span class="ava">${escape([...s.name][0].toUpperCase())}</span><span class="nm">${escape(s.name)}</span>` +
          `<span class="st${s.ready ? ' ok' : ''}">${s.ready ? '✓ готов' : s.uid === me ? 'выйти' : 'ждём'}</span>`
        : '+ Занять место';
      return `<button class="${cls}" data-id="${t+i}">${txt}</button>`;
    }).join('') + '</div>').join('');
  const votes = state.maps || {};
  const total = m => Object.keys(votes[m] || {}).length;
  const top = Math.max(...MAPS.map(total));
  document.getElementById('maps').innerHTML = MAPS.map(m => {
    const v = votes[m] || {}, c = total(m);
    const cls = 'map' + (v[me] ? ' voted' : '') + (c && c === top ? ' top' : '');
    return `<button class="card ${cls}" data-map="${m}"><img src="maps/${m.toLowerCase()}.webp" alt="" loading="lazy">` +
      `<div class="info"><b>${m}</b> <span>${c}</span><small>${Object.values(v).map(escape).join(', ')}</small></div></button>`;
  }).join('');
  const n = SLOTS.filter(k => state[k]).length;
  const ready = SLOTS.filter(k => state[k] && state[k].ready).length;
  const st = document.getElementById('status');
  st.textContent = `Игроков: ${n}/8 · готовы: ${ready}/${n}` + (ready === 8 ? ' — ВСЕ ГОТОВЫ, заходите в игру!' : n === 8 ? ' — ждём готовность' : '');
  st.className = ready === 8 ? 'go' : '';
  const mine = mySlot(), rb = document.getElementById('ready');
  rb.hidden = !mine;
  document.body.classList.toggle('has-ready', !!mine);
  if (mine) { rb.textContent = state[mine].ready ? '✅ Готов (нажми, чтобы отменить)' : 'Я готов'; rb.className = state[mine].ready ? 'on' : ''; }
  renderChat();
}
const mySlot = () => SLOTS.find(k => state[k] && state[k].uid === me);

let ch = 'all';
const chatKey = () => ch === 'all' ? 'all' : (mySlot() || '').replace(/\d/, '');
function renderChat(){
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.ch === ch));
  const key = chatKey(), box = document.getElementById('msgs');
  if (!key) { box.innerHTML = '<i>Займи место в команде, чтобы писать своим</i>'; return; }
  const list = Object.entries((state.chat || {})[key] || {}).sort(([a],[b]) => a < b ? -1 : 1);
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
  box.innerHTML = list.map(([, m]) => `<div><b class="${m.team || ''}">${escape(m.name)}:</b> ${escape(m.text)}</div>`).join('') || '<i>Пока пусто</i>';
  if (atBottom) box.scrollTop = box.scrollHeight;
}
const escape = s => String(s).replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';');

document.getElementById('teams').onclick = e => {
  const b = e.target.closest('[data-id]'), id = b && b.dataset.id;
  if (!SLOTS.includes(id)) return;
  const s = state[id];
  if (s && s.uid === me) return ref.child(id).remove();
  if (s) return;
  const name = nameEl.value.trim();
  if (!name) { nameEl.focus(); return alert('Сначала напиши ник'); }
  // убираем себя с прошлого места, потом атомарно занимаем новое (если его не успел занять другой)
  SLOTS.forEach(k => state[k] && state[k].uid === me && ref.child(k).remove());
  ref.child(id).transaction(cur => cur ? undefined : { name, uid: me, ts: Date.now() });
};

document.getElementById('maps').onclick = e => {
  const b = e.target.closest('[data-map]');
  if (!b || !MAPS.includes(b.dataset.map)) return;
  const name = nameEl.value.trim();
  if (!name) { nameEl.focus(); return alert('Сначала напиши ник'); }
  const r = ref.child('maps/' + b.dataset.map + '/' + me);
  (state.maps && state.maps[b.dataset.map] && state.maps[b.dataset.map][me]) ? r.remove() : r.set(name);
};

// spotlight: карточка подсвечивается там, где курсор
document.addEventListener('pointermove', e => {
  const c = e.target.closest && e.target.closest('.card');
  if (!c) return;
  const r = c.getBoundingClientRect();
  c.style.setProperty('--x', e.clientX - r.left + 'px');
  c.style.setProperty('--y', e.clientY - r.top + 'px');
});

document.getElementById('ready').onclick = () => {
  const s = mySlot();
  if (s) ref.child(s + '/ready').set(!state[s].ready);
};

document.getElementById('tabs').onclick = e => {
  if (e.target.dataset.ch) { ch = e.target.dataset.ch; renderChat(); }
};

document.getElementById('send').onsubmit = e => {
  e.preventDefault();
  const input = document.getElementById('msg'), text = input.value.trim(), key = chatKey();
  if (!text || !key) return;
  const name = nameEl.value.trim();
  if (!name) { nameEl.focus(); return alert('Сначала напиши ник'); }
  const team = (mySlot() || '').replace(/\d/, '');
  ref.child('chat/' + key).push({ name, team, text, uid: me });
  input.value = '';
  // shortcut: чистим чат с клиента, держим последние 50; если будет спам — переносить в Cloud Function
  const keys = Object.keys((state.chat || {})[key] || {}).sort();
  keys.slice(0, Math.max(0, keys.length - 49)).forEach(k => ref.child('chat/' + key + '/' + k).remove());
};

document.getElementById('reset').onclick = () => confirm('Очистить места, голоса и чат?') && ref.remove();

ref.on('value', snap => { state = snap.val() || {}; render(); },
  err => document.getElementById('status').textContent = 'Ошибка Firebase: ' + err.message);
render();
</script>
</body>
</html>
